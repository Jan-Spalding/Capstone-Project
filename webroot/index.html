<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>News Article Summarisation</title>
  <link href="/webroot/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="page" class="center">
    <div id="webpage"></div>
    <div id="info">
      <div class="center" style="justify-content: space-evenly;">
        <div id="backButton" class="center backPage">
          <p class="backPage">Back to Page</p>
        </div>
        
        <div>
          <p style="padding:0;margin:0;">Sentimental Value:</p>
          <div class="bar center">
            <p id="sed_title">Neutral</p>
            <div style="width:50%;">
              <div id="sed_negative" class="negative"></div>
            </div>
            <div style="width:50%;">
              <div id="sed_positive" class="positive"></div>
            </div>
          </div>
        </div>

        <div>
          <p style="padding:0;margin:0;">Emotional Density</p>
          <div class="bar center">
            <p id="den_title">Neutral</p>
            <div style="width:50%;">
              <div id="den_negative" class="negative"></div>
            </div>
            <div style="width:50%;">
              <div id="den_positive" class="positive"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <p style="padding:0;margin:0;">Summary Points:</p>
          <div class="center">
            <input type="range" id="no_points" min="1" value="10">
            <p id="pointText">10</p>
          </div>
        </div>
        
      </div>
      <h1>Summary:</h1>
      
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/webroot/script.js"></script>
</body>

</html>
